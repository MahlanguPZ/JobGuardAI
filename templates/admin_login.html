<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Login | JobGuardAI</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <strong>◆ JobGuard<span>AI</span></strong>
        <nav><a href="/">Back to Website</a></nav>
    </header>

    <main>
        <section class="card" style="max-width:480px;margin:60px auto;">
            <h2>Administrator Login</h2>
            <p>Sign in to manage feedback and model updates.</p>

            {% if error %}
            <p style="color:#e74c3c;">{{ error }}</p>
            {% endif %}

            <form method="post">
                <label>Administrator Access Token</label>
                <input type="password" name="token" required autocomplete="off">
                <button class="btn wide" type="submit">Sign In</button>
            </form>
        </section>
    </main>
</body>
</html>
